<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store — MONK Premium Scripts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glows">
    <span class="r"></span>
    <span class="b"></span>
    <span class="p"></span>
  </div>

  <div id="toast">
    <i class="fas fa-exclamation-triangle toast-icon"></i>
    <span class="toast-text">Redirecting to Admin<small>Please wait...</small></span>
    <span class="toast-timer" id="timer">10</span>
  </div>

  <div class="wrap">
    <nav>
      <a href="/" class="brand">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="4" y="4" width="56" height="56" rx="16" stroke="#ff5c70" stroke-width="3"/>
          <path d="M20 44V20L32 34L44 20V44" stroke="#ff5c70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        MONK<span class="accent">.</span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="#" onclick="redirectInstagram(); return false;">Admin</a>
      </div>
    </nav>

    <div class="store-head">
      <h2>Premium <em>Scripts</em></h2>
      <p>Choose your script and unlock its full potential.</p>
    </div>

    <!-- Featured MONKzV1 -->
    <div class="featured-card">
      <div class="fc-icon"><i class="fas fa-gem"></i></div>
      <div class="fc-body">
        <h3>MONKzV1 PREMIUM <span class="badge">BEST VALUE</span></h3>
        <p>The ultimate all-in-one package. Includes every script, priority updates, and direct admin support.</p>
      </div>
      <div class="fc-price">
        <div class="amount">$19.99 <small>lifetime</small></div>
        <button class="btn btn-primary" onclick="startBuyRedirect(this)">
          <i class="fas fa-shopping-cart"></i> Buy Now
        </button>
      </div>
    </div>

    <div id="scripts-container" class="product-grid">
      <div class="product" style="grid-column: 1/-1; text-align: center; color: var(--dim);">
        <i class="fas fa-spinner fa-spin" style="font-size: 1.6rem; margin-bottom: 10px;"></i>
        <p>Loading scripts...</p>
      </div>
    </div>

    <div style="text-align: center; margin: 30px 0 60px;">
      <button class="btn btn-ghost" onclick="redirectInstagram()">
        <i class="fab fa-instagram"></i> Contact Admin
      </button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const SCRIPTS_URL = 'https://raw.githubusercontent.com/MANASMCPE/M0NK-hub/main/data/scripts.json';
    const container = document.getElementById('scripts-container');
    const SCRIPT_PRICE = '$4.99';

    fetch(SCRIPTS_URL)
      .then(res => res.json())
      .then(data => {
        container.innerHTML = '';
        data.scripts.forEach(script => {
          const el = document.createElement('div');
          el.className = 'product';
          el.innerHTML = `
            <div class="product-top">
              <div class="product-icon"><i class="fas fa-file-code"></i></div>
              ${script.featured ? '<span class="product-badge featured">Featured</span>' : ''}
            </div>
            <div class="product-cat">${script.category}</div>
            <h3>${script.title}</h3>
            <p class="product-desc">${script.description.replace(/\n/g, ' ')}</p>
            <div class="product-meta">
              <span><i class="fas fa-tag"></i> ${script.version}</span>
              <span><i class="fas fa-hdd"></i> ${script.size}</span>
              <span><i class="fas fa-calendar"></i> ${script.updated}</span>
            </div>
            <div class="product-footer">
              <div class="product-price">${SCRIPT_PRICE}</div>
              <button class="btn btn-primary" onclick="startBuyRedirect(this)">
                <i class="fas fa-shopping-cart"></i> Buy
              </button>
            </div>
          `;
          container.appendChild(el);
        });
      })
      .catch(() => {
        container.innerHTML = `<div class="product" style="grid-column:1/-1;text-align:center;color:var(--rose);">
          <i class="fas fa-exclamation-circle"></i> Failed to load scripts. Try again later.
        </div>`;
      });
  </script>
</body>
</html>
